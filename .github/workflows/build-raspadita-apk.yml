name: Crear APK Vendedora con los dos juegos
on:
  push:
    paths:
      - 'raspadita-apk/www/**'
      - '.github/workflows/build-raspadita-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto San Pedro
        uses: actions/checkout@v4
      - name: Descargar proyecto Millonaria
        uses: actions/checkout@v4
        with:
          repository: jsaucedoamarilla-cyber/raspadita-millonaria
          path: millonaria-source
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar las dos raspaditas dentro de la APK
        run: |
          mkdir -p www-public www
          cp -R raspadita-apk/www/. www-public/
          cp -R raspadita-apk/www/. www/
          cp www/index.html www/juego.html
          cp www/vendedora.html www/san-pedro.html
          sed -i "s/new URL('index.html',location.href)/new URL('juego.html',location.href)/g" www/san-pedro.html
          cp millonaria-source/seller/index.html www/millonaria.html
          sed -i 's|href="../index.html"|href="index.html"|g' www/millonaria.html
          cat > www/index.html <<'EOF'
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#1b1030"><title>Raspaditas · Vendedora</title>
          <style>
          *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 16px;background:radial-gradient(circle at top,#493064,#10091d 70%);color:#fff;font:16px system-ui,sans-serif}.wrap{max-width:560px;margin:auto}h1{text-align:center;color:#ffdc78;font-size:27px}p{text-align:center;color:#d8cbe7}.card{display:block;text-decoration:none;color:#fff;padding:22px 18px;margin:18px 0;border-radius:18px;background:#241637;border:1px solid #654d7d;box-shadow:0 8px 22px #0004}.card strong{display:block;font-size:20px;margin-bottom:8px}.card span{color:#d8cbe7;font-size:14px}.sp{border-color:#d6aa52}.mi{border-color:#9b65c8}.foot{text-align:center;font-size:12px;color:#a99ab9;margin-top:28px}
          </style></head><body><main class="wrap"><h1>🎟️ RASPADITAS · VENDEDORA</h1><p>Elegí el juego al que querés entrar.</p>
          <a class="card sp" href="san-pedro.html"><strong>🟡 Raspadita San Pedro del Ycuamandyyú</strong><span>Ingresar con tu número de vendedora y PIN. Boletas e inventario de San Pedro.</span></a>
          <a class="card mi" href="millonaria.html"><strong>🎡 Raspadita Millonaria</strong><span>Ingresar con tu usuario y contraseña. Boletas y ruleta de Millonaria.</span></a>
          <p class="foot">Cada juego conserva su propio acceso y sus propios datos.</p></main></body></html>
          EOF
          cat > package.json <<'EOF'
          {
            "name": "raspaditas-vendedora",
            "version": "1.1.0",
            "private": true,
            "scripts": {},
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "py.com.raspadita.vendedora",
            "appName": "Raspaditas Vendedora",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              }
            }
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Copiar APK a enlace público de descarga
        run: |
          mkdir -p www-public/descargas
          cp android/app/build/outputs/apk/debug/app-debug.apk www-public/descargas/Raspaditas-Vendedora.apk
      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Raspaditas-San-Pedro-y-Millonaria-APK-Vendedora
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Preparar publicación web pública de San Pedro
        uses: actions/upload-pages-artifact@v3
        with:
          path: www-public
      - name: Publicar página web pública
        uses: actions/deploy-pages@v4
