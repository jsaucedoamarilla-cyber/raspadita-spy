name: Publicar Raspadita San Pedro del Ycuamandyyu

on:
  push:
    branches: [main]
    paths:
      - "raspadita-apk/www/**"
      - ".github/workflows/publicar-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar página pública
        uses: actions/upload-pages-artifact@v3
        with:
          path: raspadita-apk/www

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
