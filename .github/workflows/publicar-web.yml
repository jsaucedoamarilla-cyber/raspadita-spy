name: Publicar sitio (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar sitio
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/
          cp -R san-pedro millonaria site/
          if [ -f millonaria-vendedora.html ]; then cp millonaria-vendedora.html site/; fi
          touch site/.nojekyll
          cat > site/404.html <<'EOF'
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No encontrado</title></head><body><p>Archivo no encontrado. <a href="/raspadita-spy/">Volver al inicio</a></p></body></html>
          EOF
          test -s site/index.html
          test -s site/san-pedro/index.html
          test -s site/san-pedro/admin.html
          test -s site/millonaria/index.html
          test -s site/millonaria/admin.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
