name: Publicar Raspadita San Pedro del Ycuamandyyu

on:
  push:
    branches: [main]
    paths:
      - "raspadita-apk/www/**"
      - "millonaria/**"
      - "docs/prueba-ruleta.html"
      - "san-pedro.html"
      - ".github/workflows/publicar-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar página pública con selector en el inicio
        run: |
          rm -rf public-site
          cp -R raspadita-apk/www public-site
          mkdir -p public-site/san-pedro public-site/millonaria
          cp raspadita-apk/www/index.html public-site/san-pedro/index.html
          cp raspadita-apk/www/selector.html public-site/index.html
          cp san-pedro.html public-site/san-pedro.html
          cp millonaria/index.html public-site/millonaria/index.html
          cp millonaria/admin.html public-site/millonaria/admin.html
          cp docs/prueba-ruleta.html public-site/prueba-ruleta.html
          touch public-site/.nojekyll
          cat > public-site/404.html <<'EOF'
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=/raspadita-spy/"><title>Raspaditas</title></head><body><p>Abriendo Raspaditas… <a href="/raspadita-spy/">Continuar</a></p></body></html>
          EOF
          test -s public-site/index.html
          test -s public-site/san-pedro/index.html
          test -s public-site/san-pedro.html
          test -s public-site/millonaria/index.html

      - name: Cargar página pública
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
