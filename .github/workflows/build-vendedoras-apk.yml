name: Crear APK Vendedora (San Pedro + Millonaria)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'san-pedro/**'
      - 'millonaria/**'
      - 'millonaria-vendedora.html'
      - 'raspadita-apk/android-webview/**'
      - '.github/workflows/build-vendedoras-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar los dos juegos
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Preparar los archivos internos de Android
        shell: bash
        run: |
          set -euo pipefail
          APP='raspadita-apk/android-webview'
          WWW="$APP/app/src/main/assets/www"
          rm -rf "$WWW"
          mkdir -p "$WWW/san-pedro" "$WWW/millonaria"
          cp san-pedro/index.html "$WWW/san-pedro/index.html"
          cp san-pedro/vendedora.html "$WWW/san-pedro/vendedora.html"
          cp millonaria/index.html "$WWW/millonaria/index.html"
          cp millonaria-vendedora.html "$WWW/millonaria-vendedora.html"
          cp san-pedro/icons/icon-192.png "$WWW/icon-192.png"
          sed -i 's|href="./">Volver al juego|href="index.html">Volver al juego|g' "$WWW/san-pedro/vendedora.html"
          sed -i 's|https://jsaucedoamarilla-cyber.github.io/raspadita-spy/index.html|https://jsaucedoamarilla-cyber.github.io/raspadita-spy/san-pedro/index.html|g' "$WWW/san-pedro/vendedora.html"
          cat > "$WWW/selector.html" <<'EOF'
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#1b1030"><title>Raspaditas · Vendedora</title>
          <style>
          *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 16px;background:radial-gradient(circle at top,#493064,#10091d 70%);color:#fff;font:16px system-ui,sans-serif}.wrap{max-width:560px;margin:auto}h1{text-align:center;color:#ffdc78;font-size:27px}p{text-align:center;color:#d8cbe7}.card{display:block;text-decoration:none;color:#fff;padding:22px 18px;margin:18px 0;border-radius:18px;background:#241637;border:1px solid #654d7d;box-shadow:0 8px 22px #0004}.card strong{display:block;font-size:20px;margin-bottom:8px}.card span{color:#d8cbe7;font-size:14px}.sp{border-color:#d6aa52}.mi{border-color:#9b65c8}.admin{display:block;text-align:center;color:#ffdc78;margin:18px 0;font-size:14px}.foot{text-align:center;font-size:12px;color:#a99ab9;margin-top:28px}
          </style></head><body><main class="wrap"><h1>🎟️ RASPADITAS · VENDEDORA</h1><p>Elegí el juego al que querés entrar.</p>
          <a class="card sp" href="san-pedro/vendedora.html"><strong>🟡 Raspadita San Pedro del Ycuamandyyú</strong><span>Ingresar con número de vendedora y PIN. Tus boletas y ventas.</span></a>
          <a class="card mi" href="millonaria-vendedora.html"><strong>🎡 Raspadita Millonaria</strong><span>Ingresar con usuario y contraseña. Tus boletas y ruleta.</span></a>
          <a class="admin" href="https://jsaucedoamarilla-cyber.github.io/raspadita-spy/san-pedro/admin.html">Panel administrador · San Pedro</a>
          <a class="admin" href="https://jsaucedoamarilla-cyber.github.io/raspadita-spy/millonaria/admin.html">Panel administrador · Millonaria</a>
          <p class="foot">Cada juego usa su propio acceso y su propia base de datos.</p></main></body></html>
          EOF
          cat > "$WWW/index.html" <<'EOF'
          <!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><script>location.replace('selector.html')</script><a href="selector.html">Abrir Raspaditas</a></body></html>
          EOF
          test -s "$WWW/selector.html"
          test -s "$WWW/san-pedro/index.html"
          test -s "$WWW/san-pedro/vendedora.html"
          test -s "$WWW/millonaria/index.html"
          test -s "$WWW/millonaria-vendedora.html"
          grep -q 'raspadita-admin' "$WWW/san-pedro/vendedora.html"
          grep -q 'raspadita-public' "$WWW/millonaria-vendedora.html"
      - name: Compilar APK
        working-directory: raspadita-apk/android-webview
        run: gradle assembleDebug
      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Raspaditas-Vendedora-2-Juegos-APK
          path: raspadita-apk/android-webview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
