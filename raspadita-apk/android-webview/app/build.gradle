plugins { id 'com.android.application' }
android {
    namespace 'com.sanpedro.raspadita'
    compileSdk 34
    defaultConfig {
        applicationId "com.sanpedro.raspadita"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
