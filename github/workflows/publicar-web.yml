
name: Publicar Raspadita Spy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio web
        uses: actions/upload-pages-artifact@v3
        with:
          path: raspadita-apk/www

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
